name: CI/CD - Docker Build & Push
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/day-lai-xe-danang:latest \
            -t ${{ secrets.DOCKER_USERNAME }}/day-lai-xe-danang:${{ github.sha }} .
            
      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/day-lai-xe-danang:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/day-lai-xe-danang:${{ github.sha }}